name: Browser smoke tests

on:
  pull_request:
    branches:
      - main
      - feat/forecast-accuracy-tracker
  push:
    branches:
      - feat/forecast-accuracy-tracker
      - feat/forecast-alerts-action-center
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium:
    name: Chromium (${{ matrix.fixture }} data)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        fixture:
          - empty
          - populated
    env:
      MOCK_DATA_MODE: ${{ matrix.fixture }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install project and browser-test dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        run: npm run test:e2e

      - name: Upload browser traces and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results-${{ matrix.fixture }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
