name: sync

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/sync.yml
  schedule:
    - cron: "47 1-23/3 * * *"

permissions:
  contents: read

jobs:
  sync:
    name: Save clan snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Validate required secrets
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          if [[ -z "$CRON_SECRET" ]]; then
            echo "::error::Repository secret CRON_SECRET is missing."
            exit 1
          fi
          if [[ -z "$SITE_URL" ]]; then
            echo "::error::Repository secret SITE_URL is missing."
            exit 1
          fi
          case "$SITE_URL" in
            https://*|http://*) ;;
            *)
              echo "::error::SITE_URL must be a full URL starting with https:// or http://."
              exit 1
              ;;
          esac

      - name: Request snapshot and check audit health
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          response="$(curl --fail-with-body --silent --show-error --max-time 60 \
            --request POST \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            --header "Accept: application/json" \
            "${SITE_URL%/}/api/sync")"
          printf '%s\n' "$response"

          audit_status="$(jq -r '.audit_status // "unknown"' <<< "$response")"
          if [[ "$audit_status" != "ok" ]]; then
            echo "::error::Snapshot sync completed with audit_status=$audit_status."
            exit 1
          fi

          if jq -e '.audit_alert == true' >/dev/null <<< "$response"; then
            echo "::error::Snapshot sync completed, but audit storage has degraded for at least two consecutive runs."
            exit 1
          fi
